name: Kaluzy obj2tifxyz validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'volume-cartographer/apps/src/vc_obj2tifxyz.cpp'
      - 'volume-cartographer/core/test/test_obj2tifxyz_zero_valid.cpp'
      - 'volume-cartographer/core/test/CMakeLists.txt'

permissions:
  contents: read
  packages: read

jobs:
  test-obj2tifxyz-zero-valid:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/scrollprize/vc3d-deps/linux:sha-0c371b1d472c5281b703d65517e980d945da693f
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure focused CLI test build
        working-directory: volume-cartographer
        run: |
          cmake -S . -B build/kaluzy-obj2tifxyz -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=flang \
            -DVC_QUICKBUILD_OPT_LEVEL=0 \
            -DVC_USE_PCH=OFF \
            -DVC_TESTING=ON \
            -DVC_BUILD_APPS=ON \
            -DVC_BUILD_UI_TRACER=OFF \
            -DVC_BUILD_FLATBOI=OFF
      - name: Build regression and real CLI
        working-directory: volume-cartographer
        run: cmake --build build/kaluzy-obj2tifxyz --target test_obj2tifxyz_zero_valid --parallel 4
      - name: Run zero-valid regression
        working-directory: volume-cartographer
        run: ctest --test-dir build/kaluzy-obj2tifxyz --output-on-failure -R '^test_obj2tifxyz_zero_valid

      - name: Probe published PHercParis4 segment assets
        working-directory: volume-cartographer
        shell: bash
        run: |
          set -euo pipefail
          base="http://dl.ash2txt.org/full-scrolls/Scroll1.volpkg/paths/20231007101619/"
          mkdir -p build/real-segment-probe
          curl -LfsS -u 'registeredusers:only' "$base" -o build/real-segment-probe/index.html
          echo "::group::segment directory listing"
          sed -n '1,120p' build/real-segment-probe/index.html
          echo "::endgroup::"
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("build/real-segment-probe/index.html").read_text(errors="replace")
          objs = sorted(set(re.findall(r'href=["\'']([^"\'']+\.obj)["\'']', html, flags=re.I)))
          print("OBJ_CANDIDATES=" + "|".join(objs))
          if objs:
              Path("build/real-segment-probe/obj-name.txt").write_text(objs[0])
          PY
