name: Kaluzy obj2tifxyz validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'volume-cartographer/apps/src/vc_obj2tifxyz.cpp'
      - 'volume-cartographer/core/test/test_obj2tifxyz_zero_valid.cpp'
      - 'volume-cartographer/core/test/CMakeLists.txt'

permissions:
  contents: read
  packages: read

jobs:
  test-obj2tifxyz-zero-valid:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/scrollprize/vc3d-deps/linux:sha-0c371b1d472c5281b703d65517e980d945da693f
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure focused CLI test build
        working-directory: volume-cartographer
        run: |
          cmake -S . -B build/kaluzy-obj2tifxyz -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=flang \
            -DVC_QUICKBUILD_OPT_LEVEL=0 \
            -DVC_USE_PCH=OFF \
            -DVC_TESTING=ON \
            -DVC_BUILD_APPS=ON \
            -DVC_BUILD_UI_TRACER=OFF \
            -DVC_BUILD_FLATBOI=OFF
      - name: Build regression and real CLI
        working-directory: volume-cartographer
        run: cmake --build build/kaluzy-obj2tifxyz --target test_obj2tifxyz_zero_valid --parallel 4
      - name: Run zero-valid regression
        working-directory: volume-cartographer
        run: ctest --test-dir build/kaluzy-obj2tifxyz --output-on-failure -R '^test_obj2tifxyz_zero_valid$'
