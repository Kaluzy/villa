name: Validate patched obj2tifxyz scale

on:
  push:
    branches:
      - validate/obj2tifxyz-scale

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/scrollprize/vc3d-deps/linux:sha-0c371b1d472c5281b703d65517e980d945da693f
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/obj2tifxyz-measured-scale-latest

      - name: Configure CLI + tests
        working-directory: volume-cartographer
        run: |
          cmake -S . -B build/scale-fix -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=flang \
            -DVC_QUICKBUILD_OPT_LEVEL=0 \
            -DVC_USE_PCH=OFF \
            -DVC_TESTING=ON \
            -DVC_BUILD_APPS=ON \
            -DVC_BUILD_UI_TRACER=OFF \
            -DVC_BUILD_FLATBOI=OFF

      - name: Build real vc_obj2tifxyz
        working-directory: volume-cartographer
        run: cmake --build build/scale-fix --target vc_obj2tifxyz --parallel 4

      - name: Run scale regression
        working-directory: volume-cartographer
        run: ctest --test-dir build/scale-fix --output-on-failure -R test_obj2tifxyz_scale

      - name: Capture scale evidence
        working-directory: volume-cartographer
        run: python3 core/test/test_obj2tifxyz_scale.py build/scale-fix/bin/vc_obj2tifxyz
